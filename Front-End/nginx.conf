server {
    listen 80;

    server_name
        juracemamotaimoveis.com.br
        www.juracemamotaimoveis.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;

    server_name
        juracemamotaimoveis.com.br
        www.juracemamotaimoveis.com.br;

    ssl_certificate
        /etc/letsencrypt/live/juracemamotaimoveis.com.br/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/juracemamotaimoveis.com.br/privkey.pem;

    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # URLs antigas -> URLs canônicas
    location = /imoveis.html {
        return 301 /imoveis$is_args$args;
    }

    location = /sobre.html {
        return 301 /sobre$is_args$args;
    }

    location = /admin/login.html {
        return 301 /login;
    }

    # URLs públicas amigáveis
    location = /imoveis {
        try_files /imoveis.html =404;
    }

    location = /sobre {
        try_files /sobre.html =404;
    }

    location = /login {
        try_files /admin/login.html =404;
    }

    location ~ ^/imoveis/[0-9]+/[a-z0-9-]+/?$ {
    proxy_pass http://api:8080;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }


    location /api/ {
        proxy_pass http://api:8080/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /integracoes/ {
    proxy_pass http://api:8080/integracoes/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
}
